[package]
name = "drovr"
version = "0.1.0"
edition = "2024"

[[bin]]
name = "dv"
path = "src/main.rs"

[dependencies]
anyhow = "1"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"

[dev-dependencies]
tempfile = "3"
testcontainers = { version = "0.23", features = ["watchdog"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
