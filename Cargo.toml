[workspace]
resolver = "3"
members = ["crates/*"]

[workspace.package]
version = "0.1.0"
edition = "2024"

[workspace.dependencies]
agentctl-logging = { path = "crates/agentctl-logging" }
agentctl-state = { path = "crates/agentctl-state" }
agentctl-state-fs = { path = "crates/agentctl-state-fs" }
agentctl-tmux = { path = "crates/agentctl-tmux" }
agentctl-harness = { path = "crates/agentctl-harness" }
agentctl-harness-pi = { path = "crates/agentctl-harness-pi" }
agentctl-harness-claude = { path = "crates/agentctl-harness-claude" }
agentctl-core = { path = "crates/agentctl-core" }

anyhow = "1"
dirs = "5"
chrono = { version = "0.4", features = ["serde"] }
clap = { version = "4", features = ["derive"] }
owo-colors = "4"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
rust-fsm = "0.8"
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
tracing-appender = "0.2"
tempfile = "3"
testcontainers = { version = "0.23", features = ["watchdog"] }
tokio = { version = "1", features = ["macros", "rt-multi-thread", "time"] }
