post-checkout:
  parallel: true
  jobs:
    - name: codegraph
      run: mise exec -- codegraph init
pre-commit:
  parallel: true
  jobs:
    - name: format
      group:
        parallel: true
        jobs:
          - name: rust
            glob: "*.rs"
            run: mise run format
            stage_fixed: true
          - name: markdown
            glob: "*.md"
            run: mise exec -- prettier --write {staged_files}
            stage_fixed: true
    - name: lint
      glob: "*.rs"
      run: mise run lint --fix
      stage_fixed: true
    - name: test
      run: mise run test
    - name: openspec-validate
      glob: "openspec/**"
      run: mise exec -- openspec validate --all --no-interactive
