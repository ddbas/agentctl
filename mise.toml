#:schema https://mise.jdx.dev/schema/mise.json

# mise only pins tools. Tasks live in package.json / turbo.json.

[settings]
experimental = true
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
node = "26.11.1"
pnpm = "12.10.1"
prettier = "latest"
