#:schema https://mise.jdx.dev/schema/mise.json

# mise pins tools and exposes tasks that delegate to the pnpm scripts in package.json.

[settings]
experimental = true
lockfile = true

[hooks]
enter = "mise exec -- lefthook install"

[tools]
lefthook = "latest"
"github:rtk-ai/rtk" = "latest"
"npm:@colbymchenry/codegraph" = "latest"
"npm:@fission-ai/openspec" = "latest"
node = "26.11.1"
pnpm = "12.10.1"

[tasks.build]
description = "Build all packages"
run = "pnpm run build"

[tasks.typecheck]
description = "Typecheck all packages"
run = "pnpm run typecheck"

[tasks.lint]
description = "Run all linters (biome and prettier)"
run = "pnpm run lint"

[tasks.test]
description = "Run all tests"
run = "pnpm run test"

[tasks."test:snapshot"]
description = "Run CLI output snapshot tests (no Docker)"
run = "pnpm --filter agentctl run test:snapshot"

[tasks."test:snapshot:update"]
description = "Update CLI output snapshots after an intended output change"
run = "pnpm --filter agentctl run test:snapshot:update"

[tasks.install]
description = "Build and symlink agentctl into the local bin dir"
run = "pnpm run install:local"
